# =============================================================================
# Intégration continue — frontend React/Vite
#
# Ordre imposé par le cahier des charges : lint → tests unitaires → build →
# publication du livrable sur un registre.
#
# La publication ne se fait que sur `main` : une pull request valide la qualité
# sans polluer les registres.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # requis par la fédération d'identité GCP (aucune clé stockée)

env:
  IMAGE_NAME: pa-frontend

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Vérification des types (tsc)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test:coverage

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: couverture-frontend
          path: coverage/
          retention-days: 7

  image:
    name: Build et publication de l'image
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authentification Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SA_CI }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authentification Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pa/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build et push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de couches porté par GitHub : le `npm ci` n'est rejoué que si
          # le lockfile change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Récapitulatif
        run: |
          echo "### Image publiée" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Déployer avec le workflow **Deploy prod** en indiquant le tag \`sha-$(git rev-parse --short HEAD)\`." >> $GITHUB_STEP_SUMMARY
