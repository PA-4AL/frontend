server {
    # Cloud Run route le trafic vers $PORT (8080) ; l'image nginx-unprivileged
    # écoute sur 8080 sans privilège root.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets textuels (le JS/CSS buildé est déjà minifié).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cloud Run termine le TLS en amont : on interdit le sniffing et le framing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de disponibilité (smoke test de la pipeline de déploiement).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Config runtime injectée au démarrage : jamais mise en cache, sinon un
    # ancien environnement resterait collé au navigateur.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # Le HTML porte les références aux assets hashés : pas de cache non plus.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Assets hashés par Vite (index-a1b2c3d4.js) : immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # SPA : toutes les routes retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
